# Instances the kit can run. inst.sh and runner.py read this file ($RT_HOME/instances.conf wins if it exists).
#
# name   unique short name; also names the Postgres container (yaci-store-postgres-rt-<name>) and its volume
# index  1-9, unique; picks the ports: app 18100+i, Postgres 54370+i, DB proxy 54380+i,
#        node proxy 13100+i, node proxy control 14100+i, DB proxy control 14110+i
# jar    jar prefix: the newest $RT_HOME/jars/<jar>-*.jar is used (build.sh <jar> ... builds one)
# proxy  1 = node and DB traffic go through the fault proxies (needed to inject faults), 0 = direct (reference run)
# profiles  Spring profiles; "rt" is the generated test config, add ledger-state to run adapot/governance-aggr
# props  extra application properties, comma separated, "-" for none
#
# name  index  jar        proxy  profiles  props
cand    1      candidate  1      rt        -
base    2      baseline   1      rt        -
ctrl    3      candidate  0      rt        -
