# From the release-ops standard (templates/workflows/docs-deploy.yml, 2026-09-14), adapted for yaci-store: the
# Next.js site in docs/ builds with yarn (`yarn export`) into docs/out.
name: Documentation

# Pull requests that touch the docs only build. A push to the default branch that touches them, or a manual
# run on the default branch, also pushes the site to the gh-pages branch. The live site does not change
# until GitHub's Pages deployment for that push is approved in the `github-pages` environment, so every
# publish -- whichever way it was triggered -- goes through that approval.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: docs/yarn.lock

      - name: Build docs
        working-directory: docs
        run: |
          yarn install --frozen-lockfile
          yarn export

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/out
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to gh-pages
    needs: build
    # Only the default branch publishes; a pull request, or a manual run on another branch, only builds.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      # Replaces the whole gh-pages tree with the built site.
      - name: Push site to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          cname: store.yaci.xyz

      - name: Record the pending Pages deployment
        shell: bash
        run: |
          {
            echo "## Pushed to gh-pages - waiting for approval"
            echo
            echo "The site updates after the \`pages-build-deployment\` run for this push is approved in the"
            echo "\`github-pages\` environment:"
            echo "https://github.com/$GITHUB_REPOSITORY/actions/workflows/pages/pages-build-deployment"
            echo
            echo "If several are waiting, approve the newest and reject the older ones."
          } >> "$GITHUB_STEP_SUMMARY"
