name: Build Native Dev Build

# Builds the native image zips of the selected ref and keeps them as workflow artifacts (7 days). Nothing is
# published; bloxbean-snapshot-dist.yml publishes snapshot zips to the BloxBean repository.

on:
  workflow_dispatch:

permissions: {}

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'liberica'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # A subproject's version: build.gradle inserts the short commit id into a -SNAPSHOT version there.
      - name: Resolve the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(./gradlew -q :components:common:properties -PskipSigning=true | awk '/^version:/ { print $2; exit }')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

  native:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/native-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      artifact-prefix: dev-native
