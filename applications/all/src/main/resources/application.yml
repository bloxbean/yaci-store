spring:
  config:
    import: classpath:/git.properties
  banner:
    location: classpath:/banner.txt
  application:
    name: Yaci Store App
  profiles:
    include: plugins

  boot:
    admin:
      client:
        enabled: false

  batch:
    job:
      enabled: false

  ai:
    mcp:
      server:
        # The MCP server (the /mcp endpoint and the tools) is opt-in: it follows
        # yaci.store.mcp-server.enabled (default false; the 'mcp' profile sets it to true).
        enabled: ${yaci.store.mcp-server.enabled:false}

#  jpa:
#    hibernate:
#      ddl-auto: none
#    properties:
#      hibernate:
#        show_sql: false
#        generate_statistics: false
#        jdbc:
#          batch_size: 30
#          order_inserts: true

  flyway:
    locations: classpath:db/store/{vendor}
    out-of-order: true

apiPrefix: /api/v1

logging:
  file:
    name: ./logs/yaci-store.log

# OpenAPI definitions (see OpenApiGroupsConfig): show the core APIs first in Swagger UI
springdoc:
  swagger-ui:
    urls-primary-name: Core APIs
