dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.flywaydb:flyway-core'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly "org.postgresql:postgresql:${postgresDriverVersion}"
    testRuntimeOnly project(':stores:blocks')
    api project(":components:common")
    api project(':components:core')
    api project(':components:core-api')
    api project(":components:events")
    api project(":components:client")

    api(libs.yaci){
        exclude group: "com.bloxbean.cardano", module: "cardano-client-core"
    }
    api(libs.cardano.client.lib)
    api(libs.cardano.client.backend)
    api(libs.cbor)
    api(libs.codehaus.janino)
    api(libs.guava)
    api(libs.springdoc.openapi.starter.webmvc.ui)

    implementation libs.apache.commons.pool

    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
}

tasks.named('compileJava') {
    inputs.files(tasks.named('processResources'))
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'Yaci Store Spring Boot Starter'
                description = 'Yaci Store Spring Boot Starter'
            }
        }
    }
}

// Subprocess tests exercise the real early-exit path without terminating the Gradle worker.
tasks.named('test') {
    doFirst { systemProperty 'schemaOnlyTestClasspath', sourceSets.test.runtimeClasspath.asPath }
}
