####################
# MCP server
####################
# Activating this profile turns the MCP server on: yaci.store.mcp-server.enabled=true registers
# the yaci-store tools and enables the Spring AI MCP server (the /mcp endpoint). Without it (or
# with yaci.store.mcp-server.enabled=false, the default) neither the tools nor the endpoint exist.
# The MCP profile also enables analytics tools and live-data federation so tools can query both
# exported history and the current PostgreSQL data. The REST query endpoint remains disabled.
# The /mcp endpoint exposes ad-hoc SQL, so expose it only to trusted clients.
yaci:
  store:
    mcp-server:
      enabled: true

      # DApp registry tools (lookup by address / policy / script hash, categories).
      # External sync from the Cardano Fans CRFA registry performs outbound HTTP when enabled.
      dapp-registry:
        enabled: true
        external-registry:
          enabled: false
          # schedule: "0 0 2 * * ?"   # cron for the external sync when enabled (default: daily 02:00)

      # Token registry metadata / IPFS content lookup tools. Perform outbound HTTP.
      tools:
        external-metadata:
          enabled: true

    analytics:
      query:
        enabled: true
        live-data-enabled: true
        rest-api-enabled: false

spring:
  ai:
    mcp:
      server:
        name: yaci-store-mcp-server
        version: 2.0.0
        protocol: STATELESS
