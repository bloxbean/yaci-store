#######################################################################################
# Blockfrost Profile Configuration
# Activate this profile to enable all Blockfrost-compatible API endpoints.
# Usage: spring.profiles.active=ledger-state,blockfrost
#######################################################################################

store.extensions.blockfrost.enabled=true

# All sub-modules are enabled by default when store.extensions.blockfrost.enabled=true.
# To disable a specific module, uncomment and set to false:
#store.extensions.blockfrost.epoch.enabled=true
#store.extensions.blockfrost.address.enabled=true
#store.extensions.blockfrost.asset.enabled=true
#store.extensions.blockfrost.account.enabled=true
#store.extensions.blockfrost.transaction.enabled=true
#store.extensions.blockfrost.blocks.enabled=true
#store.extensions.blockfrost.scripts.enabled=true
#store.extensions.blockfrost.metadata.enabled=true
#store.extensions.blockfrost.util.enabled=true
#store.extensions.blockfrost.pools.enabled=true
#store.extensions.blockfrost.governance.enabled=true
#store.extensions.blockfrost.network.enabled=true

# Database time budget of one Blockfrost request (default 30s, a bare number is seconds, 0 disables). A query still running when
# it runs out is cancelled and the request answers 504. Only Blockfrost requests are bounded, not sync.
#store.extensions.blockfrost.query-timeout=30s

# The yaci-store instance's own public base URL (e.g. https://your-host.example.com); the Blockfrost-compatible root endpoint returns this + apiPrefix.
blockfrost.hostname=
blockfrost.apiPrefix=/api/v1/blockfrost

# Unspent UTxO table: /addresses/{address} (balance), /addresses/{address}/utxos[/{asset}] and /assets/{asset}/addresses
# read address_utxo_unspent (only the outputs not spent yet) instead of anti-joining address_utxo with tx_input.
# Nothing is written to it during the initial sync (store.utxo.unspent-table-backfill-at-tip defaults to true): it is
# built in the background when the sync reaches the tip (about 10 minutes on preprod, 2 hours on mainnet; ~15 GB on
# mainnet with its indexes), then kept current. Until then queries use address_utxo and tx_input.
# Apply the read indexes with the admin CLI (apply-indexes: index.yml, extra-index.yml, blockfrost-index.yml), as for
# address_utxo: without the table's owner indexes, address queries on it are slower than without the table.
# An API-only instance (store.read-only-mode=true) uses only unspent-table-read-enabled.
store.utxo.unspent-table-enabled=true
store.utxo.unspent-table-read-enabled=true
