group=com.bloxbean.cardano
version=3.0.0-beta6-SNAPSHOT

# Where a v* tag publishes the Maven artifacts (release-ops docs/12-bloxbean-maven-repository.md). Both are built
# and signed once, so with both true the same files go to both. A Maven Central deployment is staged and still
# needs a human to publish it (publish-central.yml); the BloxBean repository
# (https://repo.bloxbean.org/maven/releases) is public, and permanent, the moment the release run uploads it. Turn
# Central off to release to the BloxBean repository only, e.g. a patch while Central's quota is exhausted.
maven_central_publish = true
bloxbean_repo_publish = true
# Other release side effects of a v* tag, each public the moment the tag is pushed. With every flag in this file
# false a tag only builds and validates, so a release can be rehearsed end to end without publishing anything.
#   github_release  the GitHub release v<version> with the JVM zip and the Docker Compose zip
#   native_release  builds the native image zips on the v* tag and releases them separately as the pre-release
#                   rel-native-<version> (download URLs as before). A failed native build holds back nothing else.
#                   Native-only release: a patch version with native_release true and every other flag false.
#   docker_publish  pushes the bloxbean/yaci-store* images to Docker Hub; treat a pushed tag as permanent
github_release = true
native_release = true
docker_publish = true
# Snapshot distributions (bloxbean-snapshot-dist.yml): also build and publish the native image zips. They take most
# of an hour on five runners, so a snapshot carries only the JVM and Docker Compose zips unless this is true or the
# run's `native` input is ticked.
snapshot_dist_native = false

springBootVersion=3.3.4
springCloudVersion=2023.0.3
springDependencyManagementVersion=1.1.6
graalvmBuildToolVersion=0.10.2
gradleGitPropertiesVersion=2.4.2

postgresDriverVersion=42.7.1
mysqlDriverVersion=8.3.0
