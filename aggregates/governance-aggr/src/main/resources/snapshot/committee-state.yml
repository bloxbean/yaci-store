snapshot-table:
  id: committee-state
  spec-version: 1
  module: governance-aggr
  kind: DERIVED_DATA
  restore: IMPORT

  source:
    exporter-id: committee_state
    ducklake-relation: committee_state
    partition:
      strategy: EPOCH
      column: block_time

  consistency:
    cutoff:
      type: EPOCH_LTE
      column: epoch

  import:
    target-table: committee_state
    mode: MAPPED
    use-target-defaults: [update_datetime]
    batch-boundary: SINGLE_BATCH

  validation:
    key: [epoch]
    bounds: [epoch]
    required-columns: [epoch]
