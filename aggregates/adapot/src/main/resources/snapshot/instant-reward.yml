snapshot-table:
  id: instant-reward
  spec-version: 1
  module: adapot
  kind: DERIVED_DATA
  restore: IMPORT

  source:
    exporter-id: instant_reward
    ducklake-relation: instant_reward
    partition:
      strategy: EPOCH
      column: block_time

  consistency:
    cutoff:
      type: EPOCH_LTE_OFFSET
      column: epoch
      offset: 2

  import:
    target-table: instant_reward
    mode: MAPPED
    columns:
      earned_epoch:
        source: epoch
    use-target-defaults: [create_datetime]
    batch-boundary: SINGLE_BATCH

  validation:
    key: [address, type, earned_epoch]
    bounds: [epoch, spendable_epoch]
    required-columns: [address, type, earned_epoch]
