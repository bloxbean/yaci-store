snapshot-table:
  id: stake-address-balance
  spec-version: 2
  module: account
  kind: DERIVED_DATA
  restore: IMPORT

  source:
    exporter-id: stake_address_balance_snapshot
    ducklake-relation: stake_address_balance_snapshot
    partition:
      strategy: DAILY
      column: block_time

  consistency:
    cutoff:
      type: SLOT_LTE
      column: slot

  import:
    target-table: stake_address_balance
    mode: MAPPED
    columns:
      block_time:
        source: block_time
        converter: "timestamp-to-epoch-seconds"
    ignore-source-columns: [date]
    use-target-defaults: [update_datetime]
    batch-boundary: FILE_SET
    batch-size: 64

  validation:
    key: [address, slot]
    bounds: [slot, epoch]
    required-columns: [address, slot]
