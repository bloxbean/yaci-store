snapshot-table:
  id: cip68-metadata
  spec-version: 1
  module: assets-ext
  kind: EXTENSION_DATA
  restore: IMPORT

  source:
    exporter-id: cip68_metadata
    ducklake-relation: cip68_metadata
    partition:
      strategy: DAILY
      column: block_date

  consistency:
    cutoff:
      type: SLOT_LTE
      column: slot

  import:
    target-table: cip68_metadata
    mode: MAPPED
    columns:
      properties:
        source: properties
        converter: "varchar-to-jsonb"
      validation_errors:
        source: validation_errors
        converter: "varchar-to-jsonb"
    ignore-source-columns: [block_date, date]
    batch-boundary: FILE_SET
    batch-size: 64

  validation:
    key: [policy_id, asset_name, slot, tx_hash]
    bounds: [slot]
    # version is NULL for a token whose version is not a valid integer (V0_1700_2)
    required-columns: [policy_id, asset_name, slot, tx_hash, tx_index, label, datum]
