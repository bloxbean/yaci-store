[pytest]
testpaths = mainnet
markers =
    cip26: CIP-26 off-chain token metadata tests
    cip68: CIP-68 on-chain token metadata tests
    rft: CIP-68 rich fungible token (label 444) tests
    validation: validation_errors and ?validation= tests
    v2: subject endpoint tests (named after the cf-token-metadata-registry V2 API they were copied from)
    batch: Batch query tests
    deletion: CIP-26 entries deleted upstream
