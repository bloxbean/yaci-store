// Above the Spring Boot 3.3 BOM's Testcontainers 1.19.8, which cannot talk to Docker Engine 29+
// (the PostgreSQL test would skip itself as if no Docker were running). Test scope only.
ext['testcontainers.version'] = '1.21.4'

import org.gradle.api.publish.maven.MavenPublication

dependencies {

    api project(":extensions:blockfrost:blockfrost-common")
	api project(":stores:assets")
	api project(":stores-api:assets-api")
    api project(":stores:utxo")
    api project(":stores:transaction")

	implementation 'org.springframework.boot:spring-boot-starter-web'

	// BFAssetAddressesUnspentTableIT: the holders query on PostgreSQL (skipped without Docker).
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.flywaydb:flyway-core'
	testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
	testRuntimeOnly 'org.postgresql:postgresql'
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			pom {
				name = 'Yaci Store Blockfrost Assets'
				description = 'Yaci Store Blockfrost Assets API'
			}
		}
	}
}
