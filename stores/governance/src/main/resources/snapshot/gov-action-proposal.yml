snapshot-table:
  id: gov-action-proposal
  spec-version: 1
  module: governance
  kind: CHAIN_DATA
  restore: IMPORT

  source:
    exporter-id: gov_action_proposal
    ducklake-relation: gov_action_proposal
    partition:
      strategy: DAILY
      column: block_time

  consistency:
    cutoff:
      type: SLOT_LTE
      column: slot

  import:
    target-table: gov_action_proposal
    mode: MAPPED
    columns:
      details:
        source: details
        converter: "varchar-to-jsonb"
      block_time:
        source: block_time
        converter: "timestamp-to-epoch-seconds"
    ignore-source-columns: [date]
    use-target-defaults: [update_datetime]
    batch-boundary: FILE_SET
    batch-size: 64

  validation:
    key: [tx_hash, idx]
    bounds: [slot, epoch]
    required-columns: [tx_hash, idx]
