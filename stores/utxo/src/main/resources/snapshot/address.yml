snapshot-table:
  id: address
  spec-version: 1
  module: utxo
  kind: CHAIN_DATA
  restore: IMPORT

  source:
    exporter-id: address
    ducklake-relation: address
    partition:
      strategy: DAILY
      column: block_time

  consistency:
    cutoff:
      type: SLOT_LTE
      column: slot

  import:
    target-table: address
    mode: MAPPED
    ignore-source-columns: [block_time, date]
    use-target-defaults: [id, stake_credential, update_datetime]
    batch-boundary: FILE_SET
    batch-size: 64

  validation:
    key: [id]
    bounds: [slot]
    required-columns: [id]

  lossy:
    stake_credential: >-
      not present in the analytics export and not derivable from it
