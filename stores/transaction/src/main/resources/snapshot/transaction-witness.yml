snapshot-table:
  id: transaction-witness
  spec-version: 1
  module: transaction
  kind: CHAIN_DATA
  restore: IMPORT

  source:
    exporter-id: transaction_witness
    ducklake-relation: transaction_witness
    partition:
      strategy: DAILY
      column: block_time

  consistency:
    cutoff:
      type: SLOT_LTE
      column: slot

  import:
    target-table: transaction_witness
    mode: MAPPED
    columns:
      additional_data:
        source: additional_data
        converter: "varchar-to-jsonb"
    ignore-source-columns: [block, block_hash, block_time, date, epoch]
    batch-boundary: FILE_SET
    batch-size: 64

  validation:
    key: [tx_hash, idx]
    bounds: [slot]
    required-columns: [tx_hash, idx]
