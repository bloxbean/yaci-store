snapshot-table:
  id: withdrawal
  spec-version: 1
  module: transaction
  kind: CHAIN_DATA
  restore: IMPORT

  source:
    exporter-id: withdrawal
    ducklake-relation: withdrawal
    partition:
      strategy: DAILY
      column: block_time

  consistency:
    cutoff:
      type: SLOT_LTE
      column: slot

  import:
    target-table: withdrawal
    mode: MAPPED
    columns:
      block_time:
        source: block_time
        converter: "timestamp-to-epoch-seconds"
    ignore-source-columns: [date]
    use-target-defaults: [update_datetime]
    batch-boundary: FILE_SET
    batch-size: 64

  validation:
    key: [address, tx_hash]
    bounds: [slot, epoch]
    required-columns: [address, tx_hash]
