snapshot-table:
  id: pool-registration
  spec-version: 1
  module: staking
  kind: CHAIN_DATA
  restore: IMPORT

  source:
    exporter-id: pool_registration
    ducklake-relation: pool_registration
    partition:
      strategy: DAILY
      column: block_time

  consistency:
    cutoff:
      type: SLOT_LTE
      column: slot

  import:
    target-table: pool_registration
    mode: SQL
    select-resource: classpath:/snapshot/sql/pool_registration_v1.sql
    transform-version: 1
    dependencies: [block]
    columns:
      pool_owners:
        source: pool_owners
        converter: "varchar-to-jsonb"
      relays:
        source: relays
        converter: "varchar-to-jsonb"
    use-target-defaults: [margin_denominator, margin_numerator, update_datetime]
    batch-boundary: FILE_SET
    batch-size: 64

  validation:
    key: [tx_hash, cert_index]
    bounds: [slot, epoch]
    required-columns: [tx_hash, cert_index]

  lossy:
    margin_numerator: >-
      the analytics export carries the computed margin as a float only. The reward calculation
      reads the exact numerator/denominator (PoolDetails.getMargin), so a restored database
      computes every pool's operator/member split with margin zero: rewards, epoch_stake and the
      AdaPot drift from the chain at the first epoch boundary. Measured on preprod at epoch 299:
      treasury +28,639 lovelace, accumulating each epoch. Do not run the ledger-state profile on
      a restored database until the export carries the margin rationals
    margin_denominator: >-
      see margin_numerator
