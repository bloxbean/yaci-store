snapshot-table:
  id: pool-registration
  spec-version: 1
  module: staking
  kind: CHAIN_DATA
  restore: IMPORT

  source:
    exporter-id: pool_registration
    ducklake-relation: pool_registration
    partition:
      strategy: DAILY
      column: block_time

  consistency:
    cutoff:
      type: SLOT_LTE
      column: slot

  import:
    target-table: pool_registration
    mode: SQL
    select-resource: classpath:/snapshot/sql/pool_registration_v1.sql
    transform-version: 1
    dependencies: [block]
    use-target-defaults: [margin_denominator, margin_numerator, update_datetime]
    batch-boundary: FILE_SET
    batch-size: 64

  validation:
    key: [tx_hash, cert_index]
    bounds: [slot, epoch]
    required-columns: [tx_hash, cert_index]

  lossy:
    margin_numerator: >-
      the analytics export carries the computed margin only, not its numerator and denominator
    margin_denominator: >-
      the analytics export carries the computed margin only, not its numerator and denominator
