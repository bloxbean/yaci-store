services:
  admin-cli:
    # ADMIN_CLI_TAG (unset by default) runs another admin-cli build against this instance.
    image: bloxbean/yaci-store-admin-cli:${ADMIN_CLI_TAG:-${tag}}
    # The same environment and mounts as the yaci-store service (yaci-store.yml), so the CLI sees exactly
    # what the application sees: config/env and its Spring profiles, every profile file in config/, the
    # data/ folder (analytics export), logs and plugins. Snapshot output and work files go under data/,
    # e.g. --output /app/data/snapshots/out --work-dir /app/data/snapshots/work.
    env_file:
      - ../config/env
    volumes:
      - ../logs:/app/logs/
      - ../data:/app/data
      - ../config:/app/config
      - ../plugins/scripts:/app/plugins/scripts/
      - ../plugins/ext-jars:/app/plugins/ext-jars/
      - ../plugins/files:/app/plugins/files/
    stdin_open: true
    tty: true
    networks:
      - yaci-store-net

networks:
  yaci-store-net:
    name: yaci-store-net-${INSTANCE_NAME:-default}
    external: true
