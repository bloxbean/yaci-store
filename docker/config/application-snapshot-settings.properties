#######################################################################################
# Snapshot Profile Configuration
# For a node that produces snapshots, or one restored from a snapshot.
# Usage: spring.profiles.active=snapshot
#   The snapshot profile group (application.yml) activates ledger-state, analytics,
#   blockfrost and then snapshot-settings, which loads this file. Being last, these
#   settings win over the other profile files and over application.properties. A profile
#   listed after snapshot (snapshot,mine), an environment variable or a command-line
#   argument still overrides them.
#
# Choose this profile before the first sync from genesis: the settings below only give
# complete tables when they are on from the start.
#######################################################################################

# A snapshot source must never prune: a pruning service deletes rows before the analytics
# export reads them. Snapshot inspect/export refuse a source with any of these on.
store.utxo.pruning-enabled=false
store.transaction.pruning-enabled=false
store.transaction.cbor-pruning-enabled=false
store.blocks.cbor-pruning-enabled=false
store.account.pruning-enabled=false
store.account.history-cleanup-enabled=false
store.adapot.reward-pruning-enabled=false
store.adapot.epoch-stake-pruning-enabled=false

# Address table (address -> credentials, stake address). Exported and restored only when the
# source saves it; a target that turns it on needs a snapshot that carries it.
store.utxo.save-address=true

# Whole signed transaction CBOR, for the Blockfrost /txs/{hash} size and /txs/{hash}/cbor.
# Exported and restored only when the source saves it. A target with CBOR off skips it; a target
# that saves transaction bodies only (store.transaction.save-cbor) is refused.
store.transaction.save-full-tx-cbor=true

# Assets extension: CIP-68 metadata and CIP-113 registry nodes are exported and restored when the
# source runs it, and need it on from the start of sync. CIP-113 follows the registries bundled
# for mainnet, preprod and preview (or store.assets.ext.cip113.registry-nft-policy-ids); source and
# target must follow the same ones. CIP-26 registry data is not part of a snapshot, so CIP-26 sync
# is off here; turn it on if this node should serve CIP-26 metadata (a restored node then runs a
# full registry sync on start-up).
store.assets.ext.enabled=true
store.assets.ext.cip26.enabled=false
