plugins {
    id 'maven-publish'
    id 'signing'
    id 'org.flywaydb.flyway' version '12.4.0'
    id 'nu.studer.jooq' version '10.2.1'
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"

    id 'org.ajoberstar.grgit' version '5.3.3'
    // The root publishes nothing itself: it only aggregates the subprojects' publications into one Central
    // Portal deployment. Published subprojects apply com.gradleup.nmcp below.
    id 'com.gradleup.nmcp' version '1.6.2' apply false
    id 'com.gradleup.nmcp.aggregation' version '1.6.2'
}

// Built with the repository but never published to Maven: applications (shipped as zips, native images and
// Docker images), tests, examples, and the container projects that only group modules. Every other subproject is
// in the Maven Central deployment; verifyMavenReleasePublicationScope fails if this list and the publications the
// build declares (publish-common.gradle, starters/build.gradle) disagree. Add future build-only projects by path.
def mavenPublicationExcludedProjectPaths = [
        ':aggregates',
        ':applications',
        ':applications:admin',
        ':applications:admin-cli',
        ':applications:all',
        ':applications:gateway',
        ':applications:ledger-state',
        ':applications:utxo-indexer',
        ':components',
        ':e2e-tests',
        ':examples',
        ':examples:plugins',
        ':examples:plugins:java',
        ':examples:plugins:java:custom-indexer-with-plugins',
        ':extensions',
        ':extensions:blockfrost',
        ':extensions:storage',
        ':starters',
        ':stores',
        ':stores-api',
] as Set

// CI signs with an ASCII-armored signing subkey held in memory, passed as the project properties
// signingInMemoryKey, signingInMemoryKeyId (last 8 hex chars of the subkey id) and signingInMemoryKeyPassword
// (ORG_GRADLE_PROJECT_* environment variables in release.yml). Without them, local builds keep using the signing.*
// properties from ~/.gradle/gradle.properties. Called by publish-common.gradle and starters/build.gradle once the
// publications are declared.
ext.configureReleaseSigning = { Project candidate ->
    candidate.signing {
        def inMemoryKey = candidate.findProperty('signingInMemoryKey')
        if (inMemoryKey) {
            useInMemoryPgpKeys(candidate.findProperty('signingInMemoryKeyId'), inMemoryKey,
                    candidate.findProperty('signingInMemoryKeyPassword'))
        }
        sign candidate.publishing.publications
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'java-library'
    if (!mavenPublicationExcludedProjectPaths.contains(path)) {
        // Exposes this project's publications to the root nmcpAggregation.
        apply plugin: 'com.gradleup.nmcp'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            url "https://central.sonatype.com/repository/maven-snapshots/"
        }
        // BloxBean Maven repository: development snapshots of BloxBean projects (release-ops docs/12).
        maven {
            url "https://repo.bloxbean.org/maven/snapshots"
            mavenContent { snapshotsOnly() }
        }
    }

    base {
        archivesName = project.name == "all" ? 'yaci-store' : 'yaci-store-' + project.name
    }

    def commit_id=getCheckedOutGitCommitHash()
    if (project.version.endsWith("-SNAPSHOT")) {
        version = "${project.version}".replace("-SNAPSHOT", "-${commit_id}-SNAPSHOT")
    }

    plugins.withId('com.gorylenko.gradle-git-properties') {
        //gradle-git-properties 4 adds its output to the main resources, which sourceJar packages
        tasks.named('sourceJar') { dependsOn 'generateGitProperties' }

        gitProperties {
            failOnNoGitDirectory = false
            // In git worktrees, .git is a file pointing to the real git dir.
            // JGit may not resolve this, so point to the main repo's .git directory.
            def dotGit = rootProject.file('.git')
            if (dotGit.isFile()) {
                def gitDirLine = dotGit.text.trim()
                def mainGitDir = file(gitDirLine.replace('gitdir: ', '')).parentFile.parentFile
                dotGitDirectory = mainGitDir
            }
        }
    }

    //spring-boot-starter-test-classic brings spring-boot-security-test, whose MockMvc auto-configuration needs
    //spring-boot-security; Yaci Store does not use Spring Security
    configurations.matching { it.name.startsWith('test') }.configureEach {
        exclude group: 'org.springframework.boot', module: 'spring-boot-security-test'
    }

    dependencyManagement {
        imports {
            mavenBom("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        implementation(libs.mapstruct)
        annotationProcessor 'org.projectlombok:lombok'
        annotationProcessor(libs.mapstruct.processor)
        //Yaci Store, Yaci and CCL use Jackson 2; Spring Boot 4 defaults to Jackson 3
        implementation 'org.springframework.boot:spring-boot-jackson2'
        testImplementation 'org.springframework.boot:spring-boot-starter-test-classic'
        testImplementation 'io.projectreactor:reactor-test'
        //Gradle 9 no longer provides the JUnit Platform launcher
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    compileJava {
        sourceCompatibility = '25'
        targetCompatibility = '25'

        options.compilerArgs += ["-Aproject=${project.group}/${project.name}", "-parameters"]
    }

    tasks.withType(Javadoc) {
        options.encoding = 'UTF-8'
    }

    task sourceJar(type: Jar) {
        from sourceSets.main.allSource
        archiveClassifier.set('sources')
    }

    task javadocJar(type: Jar) {
        from javadoc
        archiveClassifier.set('javadoc')
    }

//    task sourceJar(type: Jar) {
////        archiveClassifier "sources"
//        from sourceSets.main.allJava
//    }

//    task javadocJar(type: Jar, dependsOn: javadoc) {
////        archiveClassifier "javadoc"
//        from javadoc.destinationDir
//    }

    artifacts {
        archives jar
        archives sourceJar
        archives javadocJar
    }

    test {
        useJUnitPlatform()
        //Gradle 9 fails a test task that finds no tests; several modules only have test helpers
        failOnNoDiscoveredTests = false
    }
}

def mavenCentralPublicationProjects = {
    allprojects.findAll { candidate ->
        def publishing = candidate.extensions.findByType(org.gradle.api.publish.PublishingExtension)
        publishing != null && publishing.publications.findByName('mavenJava') != null
    }
}

tasks.register('validateMavenCentralArtifacts') {
    group = 'verification'
    description = 'Verifies that each Maven Central publication has a POM, sources JAR, and javadoc JAR.'

    doLast {
        def errors = []

        mavenCentralPublicationProjects().each { publishedProject ->
            def publishing = publishedProject.extensions.findByType(org.gradle.api.publish.PublishingExtension)
            def publication = publishing.publications.findByName('mavenJava')

            def expectedFiles = [
                    pom    : publishedProject.layout.buildDirectory.file("publications/${publication.name}/pom-default.xml").get().asFile,
                    jar    : publishedProject.tasks.named('jar').get().archiveFile.get().asFile,
                    sources: publishedProject.tasks.named('sourceJar').get().archiveFile.get().asFile,
                    javadoc: publishedProject.tasks.named('javadocJar').get().archiveFile.get().asFile
            ]

            expectedFiles.each { type, artifactFile ->
                if (!artifactFile.isFile()) {
                    errors << "${publishedProject.path}:${publication.name} missing ${type} artifact: ${artifactFile}"
                } else if (artifactFile.length() == 0) {
                    errors << "${publishedProject.path}:${publication.name} has empty ${type} artifact: ${artifactFile}"
                }
            }
        }

        if (!errors.isEmpty()) {
            throw new GradleException("Maven Central publication validation failed:\n - " + errors.join("\n - "))
        }
    }
}

gradle.projectsEvaluated {
    tasks.named('validateMavenCentralArtifacts') {
        mavenCentralPublicationProjects().each { publishedProject ->
            dependsOn publishedProject.tasks.named('jar')
            dependsOn publishedProject.tasks.named('sourceJar')
            dependsOn publishedProject.tasks.named('javadocJar')
            dependsOn publishedProject.tasks.named('generatePomFileForMavenJavaPublication')
        }
    }
}

def commit_id=getCheckedOutGitCommitHash()
def final_version = project.version
if (project.version.endsWith("-SNAPSHOT")) {
    final_version = "${project.version}".replace("-SNAPSHOT", "-${commit_id}-SNAPSHOT")
}

task distZip(type: Zip) {
    dependsOn ':components:plugin-polyglot:build', ':applications:all:bootJar', ':applications:ledger-state:bootJar', ':applications:admin-cli:bootJar'

    if (gradle.taskGraph.hasTask(distZip)) {
        dependsOn build
    }

    print(final_version)

    def zipDirName ="yaci-store-${final_version}"
    def configDir = "config"
    def binDir = "bin"

    from('applications/all/build/libs') {
        include "yaci-store-${final_version}.jar"
        into(zipDirName)
        rename "yaci-store-${final_version}.jar", "yaci-store.jar"
    }

    from('applications/ledger-state/build/libs') {
        include "yaci-store-ledger-state-${final_version}.jar"
        into(zipDirName)
        rename "yaci-store-ledger-state-${final_version}.jar", "yaci-store-ledger-state.jar"
    }

    from('applications/admin-cli/build/libs') {
        include "yaci-store-admin-cli-${final_version}.jar"
        into(zipDirName)
        rename "yaci-store-admin-cli-${final_version}.jar", "yaci-store-admin-cli.jar"
    }

    from('components/plugin-polyglot/build/libs') {
        include "yaci-store-plugin-polyglot-${final_version}.jar"
        into(zipDirName + "/" + 'plugins')
        rename "yaci-store-plugin-polyglot-${final_version}.jar", "yaci-store-plugin-polyglot.jar"
    }

    from('components/plugin-polyglot/build/libs/plugin-libs') {
        include "*.jar"
        into(zipDirName + "/" + 'plugins/lib')
    }

    from('./docker/plugins/scripts') {
        into zipDirName + '/plugins/scripts'
    }

    from('./docker/plugins/ext-jars') {
        into zipDirName + '/plugins/ext-jars'
    }

    from('./') {
        into(zipDirName)
        include 'LICENSE'
    }

    from('./config') {
        include 'application.properties'
        include 'application-analytics.properties'
        include 'application-blockfrost.properties'
        include 'application-custom-exporters.yml'
        include 'application-ledger-state.properties'
        include 'application-plugins.yml'
        include 'application-mcp.yml'
        into zipDirName + '/' + configDir
    }

    from('./bin') {
        include("*.sh", "*.bat")
        into zipDirName + '/' + binDir
        eachFile { file ->
            if (file.name.endsWith(".sh")) {
                //Gradle 9 removed FileCopyDetails.setMode()
                file.permissions { unix('rwxr-xr-x') }
            }
        }
    }

    archiveFileName = "yaci-store-${final_version}.zip"

    destinationDirectory = file("applications/build/dist")
}

task dockerZip(type: Zip) {
    def zipDirName ="yaci-store-docker-${final_version}"

    from('./') {
        into(zipDirName)
        include 'LICENSE'
    }

    from('./docker') {
        into(zipDirName)
        include 'README.md'
        include '*.sh'
    }

    from('./docker/compose') {
        into(zipDirName + '/compose')
        include '*.yml'
        include '.env'
    }

    from('./docker/config') {
        into(zipDirName + '/config')
        include 'env'
        include 'application.properties'
        include 'application-blockfrost.properties'
        include 'application-ledger-state.properties'
        include 'application-plugins.yml'
        include 'application-analytics.properties'
        include 'application-custom-exporters.yml'
        include 'application-mcp.yml'
    }

    from('./docker/plugins') {
        into zipDirName + '/plugins'
    }

    from('./docker/grafana') {
        exclude('data')
        into zipDirName + '/grafana'
    }

    from('./docker/prometheus') {
        include 'prometheus.yml'
        into zipDirName + '/prometheus'
    }

    archiveFileName = "yaci-store-docker-${final_version}.zip"

    destinationDirectory = file("applications/build/dist")
}

def getCheckedOutGitCommitHash() {
    try {
        grgit.head().abbreviatedId
    } catch (Exception e) {
        // Fallback for git worktrees where grgit may not resolve properly
        'git rev-parse --short HEAD'.execute(null, project.rootDir).text.trim()
    }
}

// nmcp resolves its task runtime (com.gradleup.nmcp:nmcp-tasks) in the root project.
repositories {
    mavenCentral()
}

ext.ossrhUsername = System.getenv('MAVEN_USERNAME')
ext.ossrhPassword = System.getenv('MAVEN_PASSWORD')

// Central Portal publishing through the publisher API (nmcp). USER_MANAGED uploads the deployment and stops at
// VALIDATED: nothing reaches Maven Central until a human publishes it, from the portal UI or through the
// approval-gated .github/workflows/publish-central.yml.
// Do not set `publishingTimeout` here -- nmcp rejects it under USER_MANAGED.
nmcpAggregation {
    // :applications:admin and :components:admin share the name `admin`. Only :components:admin is in the
    // aggregation, and no published project depends on an application, so the clash nmcp guards against
    // (gradle/gradle#36167, two projects resolving as one module) can't happen here.
    allowDuplicateProjectNames.set(true)
    centralPortal {
        username = ossrhUsername
        password = ossrhPassword
        publishingType = 'USER_MANAGED'
        // Names the pending deployment in the portal list. The deployment id itself is assigned by the server and
        // reported by the upload task.
        publicationName = "yaci-store:${project.version}"
        // The aggregate carries every module with its sources and javadoc; the 10 minute default validation wait
        // is tight for it.
        validationTimeout = java.time.Duration.ofMinutes(30)
    }
}

// The `stagingRepository` hook (release-ops docs/12-bloxbean-maven-repository.md): publishes the same
// MavenPublications as the Central deployment to an isolated directory, from which CI uploads them to the BloxBean
// Maven repository. CI passes an absolute path:
// `./gradlew publishAllPublicationsToStagingRepository -PstagingRepository=$PWD/...`.
def stagingRepository = providers.gradleProperty('stagingRepository')
allprojects { candidate ->
    candidate.pluginManager.withPlugin('maven-publish') {
        if (stagingRepository.isPresent()) {
            candidate.publishing.repositories {
                maven {
                    name = 'staging'
                    url = candidate.uri(stagingRepository.get())
                }
            }
        }
    }
}

// The Maven Central deployment scope: every subproject that is not build-only. The root publishes nothing.
def centralDeploymentProjects = subprojects.toList().findAll { candidate ->
    !mavenPublicationExcludedProjectPaths.contains(candidate.path)
}

dependencies {
    centralDeploymentProjects.each { candidate ->
        nmcpAggregation(project(candidate.path))
    }
}

// A deployment that silently loses a module, or picks up a build-only one, is worse than one that fails, so the
// resolved scope is asserted against the publications the build actually declares.
tasks.register('verifyMavenReleasePublicationScope') {
    group = 'verification'
    description = 'Asserts the Central deployment covers exactly the Maven publications the build declares.'
    def expected = centralDeploymentProjects.collect { it.path }.toSet()
    doLast {
        def declared = allprojects.findAll { candidate ->
            candidate.pluginManager.hasPlugin('maven-publish') &&
                    !candidate.publishing.publications.withType(MavenPublication).isEmpty()
        }.collect { it.path }.toSet()
        def missing = declared - expected
        def extra = expected - declared
        if (!missing.isEmpty() || !extra.isEmpty()) {
            throw new GradleException(
                    'Central deployment scope does not match declared publications. ' +
                            "Publishing but not deployed: ${missing.sort()}; " +
                            "deployed but publishes nothing: ${extra.sort()}")
        }
        logger.lifecycle("Central deployment scope: ${expected.size()} projects")
    }
}

// The scope check must gate the work itself, not the lifecycle alias. `publishAggregationToCentralPortal` is an
// alias whose dependencies are unordered relative to each other, so hanging the check off it lets the upload run
// first. Attaching it to the zip -- which every portal task depends on -- puts the check ahead of both the bundle
// and the network calls.
tasks.matching {
    it.name in ['nmcpZipAggregation',
                'nmcpPublishAggregationToCentralPortal',
                'nmcpPublishAggregationToCentralPortalSnapshots']
}.configureEach {
    dependsOn 'verifyMavenReleasePublicationScope'
}
